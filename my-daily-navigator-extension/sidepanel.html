<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>My Daily Navigator</title>
    <link rel="stylesheet" href="sidepanel.css">
  </head>
  <body>
    <main>
      <header class="hero">
        <div class="mark" aria-hidden="true">✦</div>
        <div>
          <h1 data-i18n="panelTitle">My Daily Navigator</h1>
          <p data-i18n="poweredBy">Powered by ASTRODAMOS</p>
        </div>
      </header>

      <section class="daily" aria-labelledby="daily-heading">
        <div>
          <span class="eyebrow" data-i18n="dailyScore">Daily meeting alignment</span>
          <strong id="daily-score">—</strong>
        </div>
        <span id="daily-band" class="pill unavailable">—</span>
      </section>

      <div class="actions">
        <button id="connect" type="button" data-i18n="connectCalendar">Connect Google Calendar</button>
        <button id="refresh" class="secondary" type="button" data-i18n="refresh">Refresh</button>
      </div>

      <section class="bridge-card" aria-labelledby="bridge-heading">
        <h2 id="bridge-heading" data-i18n="personalDataTitle">Personal timing connection</h2>
        <p id="bridge-status" role="status" aria-live="polite" data-i18n="personalDataDisconnected">Personal timing data is not connected.</p>
        <div class="actions bridge-actions">
          <button id="authorize-sync" type="button" data-i18n="approveOneTimeSync">Allow one-time sync</button>
          <button id="disconnect-sync" class="secondary" type="button" data-i18n="disconnectPersonalData" hidden>Disconnect personal data</button>
        </div>
      </section>

      <p id="status" role="status" aria-live="polite" data-i18n="loading">Reading today's calendar…</p>

      <section id="biorhythm" hidden>
        <h2 data-i18n="biorhythmTitle">Biorhythm</h2>
        <div id="biorhythm-bars"></div>
      </section>

      <section aria-labelledby="meetings-heading">
        <h2 id="meetings-heading" data-i18n="todayMeetings">Today's meetings</h2>
        <div id="meetings"></div>
      </section>

      <footer data-i18n="privacyNote">Meeting titles are classified locally. Calendar access is read-only.</footer>
    </main>
    <script src="sidepanel.js"></script>
  </body>
</html>
