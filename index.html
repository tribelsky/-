<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#050a13">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="mcm-icon.svg" type="image/png">
  <link rel="apple-touch-icon" href="mcm-icon.svg">
  <title>My Cosmic Mentor</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#050a13;color:#f6f0e4;font-family:Arial,sans-serif;text-align:center}
    main{max-width:520px;padding:34px;border:1px solid #635026;border-radius:24px;background:linear-gradient(145deg,#111a2b,#070d18);box-shadow:0 28px 80px #0008}
    h1{color:#f2c46d}p{line-height:1.7}.error{color:#ff8792}
  </style>
</head>
<body>
  <main>
    <h1>My Cosmic Mentor</h1>
    <p id="status">הדוח האישי שלך נטען…</p>
  </main>
  <script>
    const fromBase64Url = (value) => {
      const normalized = value.replace(/-/g, "+").replace(/_/g, "/");
      const padded = normalized + "=".repeat((4 - normalized.length % 4) % 4);
      return Uint8Array.from(atob(padded), character => character.charCodeAt(0));
    };
    const rotateLeft = (value, bits) => ((value << bits) | (value >>> (32 - bits))) >>> 0;
    const readWord = (bytes, offset) =>
      (bytes[offset] | (bytes[offset + 1] << 8) | (bytes[offset + 2] << 16) | (bytes[offset + 3] << 24)) >>> 0;
    const quarterRound = (state, a, b, c, d) => {
      state[a] = (state[a] + state[b]) >>> 0; state[d] = rotateLeft(state[d] ^ state[a], 16);
      state[c] = (state[c] + state[d]) >>> 0; state[b] = rotateLeft(state[b] ^ state[c], 12);
      state[a] = (state[a] + state[b]) >>> 0; state[d] = rotateLeft(state[d] ^ state[a], 8);
      state[c] = (state[c] + state[d]) >>> 0; state[b] = rotateLeft(state[b] ^ state[c], 7);
    };
    const chacha20 = (input, key, nonce) => {
      const output = new Uint8Array(input.length);
      const constants = new TextEncoder().encode("expand 32-byte k");
      for (let offset = 0, counter = 1; offset < input.length; offset += 64, counter++) {
        const initial = new Uint32Array(16);
        for (let i = 0; i < 4; i++) initial[i] = readWord(constants, i * 4);
        for (let i = 0; i < 8; i++) initial[4 + i] = readWord(key, i * 4);
        initial[12] = counter >>> 0;
        initial[13] = readWord(nonce, 0);
        initial[14] = readWord(nonce, 4);
        initial[15] = readWord(nonce, 8);
        const state = new Uint32Array(initial);
        for (let i = 0; i < 10; i++) {
          quarterRound(state, 0, 4, 8, 12); quarterRound(state, 1, 5, 9, 13);
          quarterRound(state, 2, 6, 10, 14); quarterRound(state, 3, 7, 11, 15);
          quarterRound(state, 0, 5, 10, 15); quarterRound(state, 1, 6, 11, 12);
          quarterRound(state, 2, 7, 8, 13); quarterRound(state, 3, 4, 9, 14);
        }
        const block = new Uint8Array(64);
        const view = new DataView(block.buffer);
        for (let i = 0; i < 16; i++) view.setUint32(i * 4, (state[i] + initial[i]) >>> 0, true);
        const length = Math.min(64, input.length - offset);
        for (let i = 0; i < length; i++) output[offset + i] = input[offset + i] ^ block[i];
      }
      return output;
    };
    const queryParams = new URLSearchParams(location.search);
    const cutoverTestValue = queryParams.get("cutoverTest");
    const cutoverTestMinutes = cutoverTestValue === "noon"
      ? 12 * 60
      : /^\d{4}$/.test(cutoverTestValue || "")
        ? Number(cutoverTestValue.slice(0, 2)) * 60 + Number(cutoverTestValue.slice(2))
        : null;
    const israelReportDate = () => {
      const parts = new Intl.DateTimeFormat("en-CA", {
        timeZone: "Asia/Jerusalem",
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        hourCycle: "h23"
      }).formatToParts(new Date());
      const values = Object.fromEntries(parts.map(part => [part.type, part.value]));
      const calendarDate = `${values.year}-${values.month}-${values.day}`;
      if (cutoverTestMinutes !== null) {
        const currentMinutes = Number(values.hour) * 60 + Number(values.minute || 0);
        if (currentMinutes < cutoverTestMinutes) return calendarDate;
        return new Date(Date.UTC(
          Number(values.year), Number(values.month) - 1, Number(values.day) + 1
        )).toISOString().slice(0, 10);
      }
      if (Number(values.hour) >= 7) return calendarDate;
      return new Date(Date.UTC(
        Number(values.year),
        Number(values.month) - 1,
        Number(values.day) - 1
      )).toISOString().slice(0, 10);
    };
    (async () => {
      const reportId = queryParams.get("r");
      const keyText = location.hash.slice(1);
      const savedPersonalUrl = localStorage.getItem("mcmPersonalUrl");
      // Installed PWAs start from the shared manifest URL, which deliberately
      // has no personal key in it. Restore the encrypted personal URL already
      // saved on this device instead of treating the launch as an invalid link.
      if (!reportId && savedPersonalUrl) {
        location.replace(savedPersonalUrl);
        return;
      }
      if (!/^[a-z0-9]{8}$/.test(reportId || "") || !keyText) throw new Error("missing");
      localStorage.setItem("mcmPersonalUrl", location.href);
      const response = await fetch(`reports/${reportId}.json?v=${Date.now()}`, { cache: "no-store" });
      if (!response.ok) throw new Error("not-found");
      const encrypted = await response.json();
      if (encrypted.algorithm !== "chacha20") throw new Error("unsupported");
      let currentDate = israelReportDate();
      if (encrypted.days && !encrypted.days[currentDate]) {
        const availableDays = Object.keys(encrypted.days).sort();
        currentDate = availableDays.find(day => day > currentDate) || availableDays.at(-1) || currentDate;
      }
      const encryptedDay = encrypted.days ? encrypted.days[currentDate] : encrypted;
      if (!encryptedDay?.data || !encryptedDay?.nonce) throw new Error("date-not-ready");
      const plaintext = chacha20(
        fromBase64Url(encryptedDay.data),
        fromBase64Url(keyText),
        fromBase64Url(encryptedDay.nonce)
      );
      const decompressed = encrypted.compression === "gzip"
        ? await new Response(
            new Blob([plaintext]).stream().pipeThrough(new DecompressionStream("gzip"))
          ).arrayBuffer()
        : plaintext;
      const decodedReport = new TextDecoder().decode(decompressed);
      let reportPackage = null;
      try {
        const candidate = JSON.parse(decodedReport);
        if (candidate?.format === "mcm-multipage-v1" && candidate.pages) reportPackage = candidate;
      } catch {}
      const allowedPages = new Set(["home", "today", "tomorrow", "week"]);
      const requestedPage = allowedPages.has(queryParams.get("page"))
        ? queryParams.get("page")
        : (reportPackage?.default_page || "today.html").replace(/\.html$/i, "");
      let reportHtml = reportPackage
        ? reportPackage.pages[`${requestedPage}.html`] || reportPackage.pages[reportPackage.default_page]
        : decodedReport;
      if (!reportHtml) throw new Error("page-not-ready");
      if (reportPackage) {
        const pageUrl = page => `?r=${encodeURIComponent(reportId)}&page=${page}#${encodeURIComponent(keyText)}`;
        reportHtml = reportHtml.replace(
          /href=(["'])(?:\.\/)?(home|today|tomorrow|week)\.html(?:#[^"']*)?\1/gi,
          (_match, quote, page) => `href=${quote}${pageUrl(page.toLowerCase())}${quote}`
        );
      }
      const mobileScrollFix = `<style id="mcm-mobile-scroll-fix">
        html{height:auto!important;min-height:100%!important;overflow-x:hidden!important;overflow-y:auto!important;-webkit-overflow-scrolling:touch!important}
        body{height:auto!important;min-height:100%!important;overflow-x:hidden!important;overflow-y:visible!important;touch-action:pan-y pinch-zoom!important;overscroll-behavior-y:auto!important}
        .chart-wrap,.chart{touch-action:pan-y pinch-zoom!important}
        #mcm-install{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:9999;width:min(92vw,420px);border:1px solid #ffe08a;border-radius:18px;padding:15px 20px;background:linear-gradient(135deg,#f2c46d,#ffe292);color:#16110a;font:800 17px Arial,"Noto Sans Hebrew",sans-serif;box-shadow:0 14px 42px #000b,0 0 0 4px #f2c46d22;cursor:pointer;text-align:center}
        #mcm-install:focus-visible{outline:3px solid #63ddff;outline-offset:3px}
        #mcm-install-sheet[hidden]{display:none!important}
        #mcm-install-sheet{position:fixed;inset:0;z-index:10000;display:grid;place-items:end center;padding:18px;background:#02050dbb;backdrop-filter:blur(5px);font-family:Arial,"Noto Sans Hebrew",sans-serif;direction:rtl;text-align:right}
        #mcm-install-panel{width:min(100%,480px);border:1px solid #d7b76a;border-radius:24px;padding:24px;background:linear-gradient(155deg,#111a2b,#070d18);color:#f8f1e4;box-shadow:0 24px 70px #000c}
        #mcm-install-panel h2{margin:0 0 12px;color:#f2c46d;font-size:23px;line-height:1.25}
        #mcm-install-panel p{margin:0 0 18px;color:#f8f1e4!important;font-size:17px!important;line-height:1.65!important;white-space:pre-line}
        #mcm-install-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
        #mcm-install-actions button{min-height:48px;border-radius:14px;padding:10px 14px;font:700 16px Arial,"Noto Sans Hebrew",sans-serif;cursor:pointer}
        #mcm-install-now{grid-column:1/-1;border:1px solid #ffe08a;background:linear-gradient(135deg,#f2c46d,#ffe292);color:#16110a;font-size:18px!important}
        #mcm-install-now[hidden],#mcm-copy-link[hidden]{display:none!important}
        #mcm-copy-link{border:1px solid #ffe08a;background:linear-gradient(135deg,#f2c46d,#ffe292);color:#16110a}
        #mcm-close-install{border:1px solid #8090a8;background:#172338;color:#fff}
        #mcm-copy-status{min-height:24px;margin:12px 0 0!important;color:#9ce8b6!important;font-size:14px!important;text-align:center}
        @media(max-width:820px){
          body{font-size:17px!important}
          p,.short-text,.source-row,.timeline-card p,.meeting-card p,.process-meta,.process-house,.process-time{font-size:17px!important;line-height:1.65!important}
          .source-ref,.voice-status,.stamp,.eyebrow{font-size:13px!important;line-height:1.5!important}
          .page-nav a,.voice-button{font-size:16px!important}
        }
        @media(display-mode:standalone){#mcm-install{display:none!important}}
      </style>`;
      const installControl = `<button id="mcm-install" type="button" aria-label="שמירת האפליקציה בטלפון">שמירת האפליקציה בטלפון</button>
        <section id="mcm-install-sheet" role="dialog" aria-modal="true" aria-labelledby="mcm-install-title" hidden>
          <div id="mcm-install-panel">
            <h2 id="mcm-install-title">שמירת האפליקציה בטלפון</h2>
            <p id="mcm-install-message"></p>
            <div id="mcm-install-actions">
              <button id="mcm-install-now" type="button" hidden>התקנה עכשיו</button>
              <button id="mcm-copy-link" type="button">העתקת הקישור האישי</button>
              <button id="mcm-close-install" type="button">סגירה</button>
            </div>
            <p id="mcm-copy-status" role="status" aria-live="polite"></p>
          </div>
        </section>`;
      const installScript = `<script>
        (() => {
          // The encrypted report may contain its own legacy install control.
          // Keep one deterministic control owned by the live shell.
          document.querySelectorAll(".app-install-button,.install-sheet").forEach(element => element.remove());
          const button = document.getElementById("mcm-install");
          const sheet = document.getElementById("mcm-install-sheet");
          const sheetTitle = document.getElementById("mcm-install-title");
          const sheetMessage = document.getElementById("mcm-install-message");
          const installNowButton = document.getElementById("mcm-install-now");
          const copyButton = document.getElementById("mcm-copy-link");
          const closeButton = document.getElementById("mcm-close-install");
          const copyStatus = document.getElementById("mcm-copy-status");
          let installPrompt = null;
          const userAgent = navigator.userAgent || "";
          const isApplePhone = /iPhone|iPad|iPod/i.test(userAgent);
          const isAndroid = /Android/i.test(userAgent);
          const isMobile = isApplePhone || isAndroid;
          const isSafari = /Safari/i.test(userAgent) && !/CriOS|FxiOS|EdgiOS|OPiOS/i.test(userAgent);
          const isEmbeddedBrowser = /WhatsApp|FBAN|FBAV|Instagram|; wv[)]|[ ;]wv[ ;/)]/i.test(userAgent);
          const isStandalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
          if (isStandalone) button?.remove();
          if (isEmbeddedBrowser && button) button.textContent = "שמירת האפליקציה בטלפון";
          const closeInstallSheet = () => {
            if (!sheet) return;
            sheet.hidden = true;
            document.body.style.overflow = "";
            button?.focus();
          };
          const showInstallInstructions = () => {
            if (!sheet || !sheetTitle || !sheetMessage) return;
            copyStatus.textContent = "";
            installNowButton.hidden = !installPrompt;
            copyButton.hidden = !isEmbeddedBrowser;
            if (installPrompt) {
              sheetTitle.textContent = "שמירת האפליקציה בטלפון";
              sheetMessage.textContent = "לחצו על ‘התקנה עכשיו’. לאחר האישור האפליקציה תישמר בטלפון ותופיע כמו אפליקציה רגילה.";
            } else if (isApplePhone) {
              sheetTitle.textContent = isSafari && !isEmbeddedBrowser ? "התקנה ב-Safari" : "פתיחה ב-Safari והתקנה";
              sheetMessage.textContent = isSafari && !isEmbeddedBrowser
                ? "לחצו על כפתור השיתוף של Safari, בחרו ‘הוספה למסך הבית’ ואז ‘הוספה’."
                : "הקישור פתוח כעת בתוך WhatsApp או בדפדפן שאינו מאפשר התקנה. לחצו על ‘העתקת הקישור האישי’, פתחו את Safari והדביקו אותו בשורת הכתובת. לאחר שהדוח נפתח, לחצו על שיתוף ובחרו ‘הוספה למסך הבית’.";
            } else if (isAndroid) {
              sheetTitle.textContent = isEmbeddedBrowser ? "פתיחה ב-Chrome והתקנה" : "התקנה ב-Chrome";
              sheetMessage.textContent = isEmbeddedBrowser
                ? "הקישור פתוח כעת בתוך WhatsApp, שאינו מאפשר התקנת אפליקציות. אם בתפריט של WhatsApp מופיעה ‘פתיחה ב-Chrome’ — בחרו בה. אם לא, לחצו כאן על ‘העתקת הקישור האישי’, פתחו את Chrome והדביקו אותו בשורת הכתובת. בדוח שייפתח לחצו שוב על ‘התקנת האפליקציה’."
                : "פתחו את תפריט Chrome ובחרו ‘התקנת אפליקציה’ או ‘הוספה למסך הבית’. אם האפשרות אינה מופיעה, רעננו את העמוד ולחצו שוב על כפתור ההתקנה.";
            } else {
              sheetTitle.textContent = "התקנה בדפדפן";
              sheetMessage.textContent = "ב-Chrome או ב-Edge לחצו על סמל ההתקנה שבשורת הכתובת. אפשר גם לפתוח את תפריט הדפדפן ולבחור ‘התקנת האפליקציה’.";
            }
            sheet.hidden = false;
            document.body.style.overflow = "hidden";
            (installPrompt ? installNowButton : isEmbeddedBrowser ? copyButton : closeButton)?.focus();
          };
          const requestNativeInstall = async () => {
            if (!installPrompt) {
              showInstallInstructions();
              return;
            }
            installPrompt.prompt();
            const result = await installPrompt.userChoice;
            if (result.outcome === "accepted") {
              button?.remove();
              closeInstallSheet();
            }
            installPrompt = null;
          };
          const copyPersonalLink = async () => {
            let copied = false;
            try {
              await navigator.clipboard.writeText(location.href);
              copied = true;
            } catch {
              const field = document.createElement("textarea");
              field.value = location.href;
              field.setAttribute("readonly", "");
              field.style.position = "fixed";
              field.style.opacity = "0";
              document.body.appendChild(field);
              field.select();
              copied = document.execCommand("copy");
              field.remove();
            }
            copyStatus.textContent = copied
              ? "הקישור האישי הועתק. כעת פתחו את הדפדפן והדביקו אותו בשורת הכתובת."
              : "ההעתקה לא הצליחה. לחצו לחיצה ארוכה על כתובת הדף והעתיקו אותה.";
          };
          window.addEventListener("beforeinstallprompt", event => {
            event.preventDefault();
            installPrompt = event;
            if (button) {
              button.hidden = false;
              button.textContent = "שמירת האפליקציה בטלפון";
            }
            if (isMobile && sheet && !sheet.hidden) showInstallInstructions();
          });
          window.addEventListener("appinstalled", () => {
            installPrompt = null;
            button?.remove();
            closeInstallSheet();
          });
          button?.addEventListener("click", async () => {
            if (installPrompt) {
              await requestNativeInstall();
              return;
            }
            showInstallInstructions();
          });
          installNowButton?.addEventListener("click", requestNativeInstall);
          copyButton?.addEventListener("click", copyPersonalLink);
          closeButton?.addEventListener("click", closeInstallSheet);
          sheet?.addEventListener("click", event => {
            if (event.target === sheet) closeInstallSheet();
          });
          document.addEventListener("keydown", event => {
            if (event.key === "Escape" && sheet && !sheet.hidden) closeInstallSheet();
          });
          if (isMobile && !isStandalone) {
            setTimeout(() => {
              const marker = "mcm-install-invitation-shown";
              let alreadyShown = false;
              try { alreadyShown = sessionStorage.getItem(marker) === "yes"; } catch {}
              if (alreadyShown) return;
              try { sessionStorage.setItem(marker, "yes"); } catch {}
              showInstallInstructions();
            }, 900);
          }
          if ("serviceWorker" in navigator) {
            navigator.serviceWorker
              // A controller change must never reload the document: desktop
              // browsers can repeatedly activate the worker and create a loop.
              .register("./service-worker.js?v=15", { updateViaCache: "none" })
              .catch(() => {});
          }
          const loadedDate = "${currentDate}";
          const loadedRevision = ${JSON.stringify(encrypted.generated_at || "")};
          const activeReportId = ${JSON.stringify(reportId)};
          const cutoverTestValue = new URLSearchParams(location.search).get("cutoverTest");
          const cutoverTestMinutes = cutoverTestValue === "noon"
            ? 12 * 60
            : /^\d{4}$/.test(cutoverTestValue || "")
              ? Number(cutoverTestValue.slice(0, 2)) * 60 + Number(cutoverTestValue.slice(2))
              : null;
          const reportDateNow = () => {
            const parts = new Intl.DateTimeFormat("en-CA", {
              timeZone: "Asia/Jerusalem",
              year: "numeric",
              month: "2-digit",
              day: "2-digit",
              hour: "2-digit",
              minute: "2-digit",
              hourCycle: "h23"
            }).formatToParts(new Date());
            const values = Object.fromEntries(parts.map(part => [part.type, part.value]));
            const calendarDate = values.year + "-" + values.month + "-" + values.day;
            if (cutoverTestMinutes !== null) {
              const currentMinutes = Number(values.hour) * 60 + Number(values.minute || 0);
              if (currentMinutes < cutoverTestMinutes) return calendarDate;
              return new Date(Date.UTC(
                Number(values.year), Number(values.month) - 1, Number(values.day) + 1
              )).toISOString().slice(0, 10);
            }
            if (Number(values.hour) >= 7) return calendarDate;
            return new Date(Date.UTC(
              Number(values.year),
              Number(values.month) - 1,
              Number(values.day) - 1
            )).toISOString().slice(0, 10);
          };
          let refreshInFlight = false;
          const reloadMarkerKey = "mcm-reload-marker:" + activeReportId;
          const reloadOnce = (revision) => {
            const marker = revision || "date:" + reportDateNow();
            try {
              if (sessionStorage.getItem(reloadMarkerKey) === marker) return false;
              sessionStorage.setItem(reloadMarkerKey, marker);
            } catch {}
            location.reload();
            return true;
          };
          const refreshIfUpdated = async () => {
            if (refreshInFlight) return;
            refreshInFlight = true;
            const liveDate = reportDateNow();
            // A release may be preloaded before 07:00. Keep that newer release
            // stable; reload only when the installed page is genuinely behind.
            if (liveDate > loadedDate) {
              reloadOnce("date:" + liveDate);
              return;
            }
            try {
              const versionResponse = await fetch(
                "versions/" + encodeURIComponent(activeReportId) + ".json?v=" + Date.now(),
                { cache: "no-store" }
              );
              if (versionResponse.ok) {
                const latestVersion = await versionResponse.json();
                if (latestVersion.generated_at && latestVersion.generated_at !== loadedRevision) {
                  const payloadResponse = await fetch(
                    "reports/" + encodeURIComponent(activeReportId) + ".json?v=" + Date.now(),
                    { cache: "no-store" }
                  );
                  if (payloadResponse.ok) {
                    const livePayload = await payloadResponse.json();
                    if (livePayload.generated_at === latestVersion.generated_at) {
                      reloadOnce(latestVersion.generated_at);
                      return;
                    }
                  }
                }
              }
            } catch {}
            finally { refreshInFlight = false; }
          };
          setTimeout(refreshIfUpdated, 1000);
          setInterval(refreshIfUpdated, 15000);
          window.addEventListener("focus", refreshIfUpdated);
          window.addEventListener("pageshow", refreshIfUpdated);
          document.addEventListener("visibilitychange", () => {
            if (!document.hidden) refreshIfUpdated();
          });
        })();
      <\/script>`;
      const revisionMeta = `<meta name="mcm-revision" content="${String(encrypted.generated_at || "").replace(/[&"<>]/g, "")}">`;
      const installableReport = reportHtml
        .replace("</head>", `${revisionMeta}<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="mcm-icon.svg" type="image/png"><link rel="apple-touch-icon" href="mcm-icon.svg">${mobileScrollFix}</head>`)
        .replace(/<body([^>]*)>/i, `<body$1>${installControl}`)
        .replace("</body>", `${installScript}</body>`);
      document.open();
      document.write(installableReport);
      document.close();
    })().catch((error) => {
      document.getElementById("status").className = "error";
      document.getElementById("status").dataset.error = error.message;
      document.getElementById("status").textContent = "הקישור אינו שלם או שהדוח אינו זמין.";
    });
  </script>
</body>
</html>
